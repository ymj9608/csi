name: csi
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: csi
      POSTGRES_USER: csi
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Generate .env first}
    ports: ['127.0.0.1:5432:5432']
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U csi -d csi']
      interval: 5s
      timeout: 3s
      retries: 20
  kafka:
    image: apache/kafka:3.9.1
    ports: ['127.0.0.1:9092:9092']
    environment:
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes: [kafka-log-data:/var/lib/kafka/data]
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null']
      interval: 10s
      timeout: 10s
      retries: 20
  qdrant:
    image: qdrant/qdrant:v1.14.1
    ports: ['127.0.0.1:6333:6333']
    volumes: [qdrant-data:/qdrant/storage]
  rag-index:
    build:
      context: .
      dockerfile: agent/Dockerfile
    image: csi-python:local
    environment:
      QDRANT_URL: http://qdrant:6333
    command: [python, -m, mcp_servers.index]
    depends_on: [qdrant]
    restart: on-failure:3
  backend:
    build: backend
    environment:
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      CSI_INTEGRATION_SECRET: ${CSI_INTEGRATION_SECRET}
      CSI_INTERNAL_TOKEN: ${CSI_INTERNAL_TOKEN}
      CSI_ADMIN_USERNAME: ${CSI_ADMIN_USERNAME:-reviewer}
      CSI_ADMIN_PASSWORD: ${CSI_ADMIN_PASSWORD}
      CSI_REPOSITORY_ALLOWLIST: ${CSI_REPOSITORY_ALLOWLIST:-local/csi-demo}
      CSI_CODING_ENABLED: ${CSI_CODING_ENABLED:-false}
      CSI_CODING_REPOSITORIES: ${CSI_CODING_REPOSITORIES:-ymj9608/Lichu}
      CSI_SCAN_TIMEOUT_SECONDS: ${CSI_SCAN_TIMEOUT_SECONDS:-2100}
      CSI_VLM_PROVIDER: ${CSI_VLM_PROVIDER:-openai}
      CSI_VLM_MODEL: ${CSI_VLM_MODEL:-}
      CSI_ARCHITECTURE_MODEL: ${CSI_ARCHITECTURE_MODEL:-ministral-3:8b-instruct-2512-q4_K_M}
      CSI_ARCHITECTURE_PROMPT_VERSION: ${CSI_ARCHITECTURE_PROMPT_VERSION:-architecture-v1}
      CSI_ARCHITECTURE_JOB_TIMEOUT_SECONDS: ${CSI_ARCHITECTURE_JOB_TIMEOUT_SECONDS:-2100}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATABASE_URL: jdbc:postgresql://postgres:5432/csi
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CSI_POLICY_FILE: /app/rag/policy.json
      CSI_CATALOG_FILE: /app/rag/catalog.json
    volumes: ['./rag:/app/rag:ro']
    ports: ['127.0.0.1:8080:8080']
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:8080/api/health >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 30
  business-mcp:
    image: csi-python:local
    environment:
      CSI_INTERNAL_TOKEN: ${CSI_INTERNAL_TOKEN}
      CSI_BACKEND_URL: http://backend:8080
    command: [python, -m, mcp_servers.business]
    depends_on:
      backend: {condition: service_healthy}
  rag-mcp:
    image: csi-python:local
    environment:
      CSI_INTERNAL_TOKEN: ${CSI_INTERNAL_TOKEN}
      QDRANT_URL: http://qdrant:6333
    command: [python, -m, mcp_servers.rag]
    depends_on:
      rag-index: {condition: service_completed_successfully}
  agent:
    image: csi-python:local
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      CSI_INTERNAL_TOKEN: ${CSI_INTERNAL_TOKEN}
      CSI_REVIEW_OLLAMA_URL: ${CSI_REVIEW_OLLAMA_DOCKER_URL:-http://host.docker.internal:11434}
      CSI_REVIEW_VLM_MODEL: ${CSI_REVIEW_VLM_MODEL:-qwen3-vl:8b-instruct}
      CSI_REVIEW_VLM_TIMEOUT_SECONDS: ${CSI_REVIEW_VLM_TIMEOUT_SECONDS:-600}
      DATABASE_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      BUSINESS_MCP_URL: http://business-mcp:8001/mcp
      RAG_MCP_URL: http://rag-mcp:8002/mcp
      CSI_BACKEND_URL: http://backend:8080
    command: [uvicorn, agent.csi_agent.app:app, --host, 0.0.0.0, --port, '8000']
    depends_on:
      backend: {condition: service_healthy}
      rag-index: {condition: service_completed_successfully}
      business-mcp: {condition: service_started}
      rag-mcp: {condition: service_started}
    restart: on-failure:3
  frontend:
    build: frontend
    ports: ['127.0.0.1:5174:80']
    depends_on:
      backend: {condition: service_healthy}
  scanner:
    profiles: [tools]
    build:
      context: .
      dockerfile: rules/Dockerfile
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 1
    pids_limit: 128
    tmpfs: ['/tmp:rw,noexec,nosuid,size=128m']
    volumes:
      - ${CSI_SCAN_TARGET:-./fixtures/vulnerable}:/target:ro
      - ${CSI_SCAN_OUTPUT:-./.runtime}:/output
volumes:
  postgres-data:
  kafka-log-data:
  qdrant-data:
