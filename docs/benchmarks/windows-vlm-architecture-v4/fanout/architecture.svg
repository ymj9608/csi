<text x="495" y="1036" font-size="16" fill="#0f172a" font-weight="400">Failure-only flow</text>
<path d="M720 1030 L780 1030" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#storage)"/>
<text x="795" y="1036" font-size="16" fill="#0f172a" font-weight="400">In-memory state write</text>
<text x="48" y="1090" font-size="17" fill="#475569" font-weight="400">Each delivery route uses broker.publish(); broker.py records messages in state.MESSAGES (no actual network or queue).</text>
<text x="48" y="1120" font-size="17" fill="#475569" font-weight="400">Boxes represent code modules or simulated recipients, not independently deployed services. Inspect source for payload handling.</text>
<text x="48" y="1150" font-size="17" fill="#475569" font-weight="400">Small and expanded variants share this topology; the 48 unrelated catalog files are omitted. Not used in the completed V3 results.</text>
