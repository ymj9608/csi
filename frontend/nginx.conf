server {
 listen 80;
 server_tokens off;
 root /usr/share/nginx/html;
 client_max_body_size 1m;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy same-origin always;
 add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; frame-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
 location /api/ {
  proxy_pass http://backend:8080;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Connection "";
  proxy_buffering off;
  proxy_read_timeout 1600s;
 }
 # pdf.js worker is an ES module; nginx's default mime.types does not know .mjs.
 location ~* \.mjs$ { types { } default_type text/javascript; }
 location / { try_files $uri $uri/ /index.html; }
}
